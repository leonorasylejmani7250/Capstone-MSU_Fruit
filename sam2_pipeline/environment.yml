# Conda environment for the SAM 2.1 pipeline and demo.ipynb (a CPU is enough for the
# demo). From this folder (sam2_pipeline/):
#
#   conda env create --prefix ./envs --file environment.yml
#   conda activate ./envs
#
# Kept minimal on purpose: Python, Jupyter and the packages the code imports. PyTorch
# comes from pip (CPU build on macOS/Windows; the Linux build also runs on NVIDIA GPUs).
# The MSU HPCC uses its own setup script instead (hpcc/setup_env.sh), which installs a
# CUDA build.
#
# To add a package: add a line under "pip:" and create the environment again, or `pip
# install` it in the active environment. requirements.txt is the list for the HPCC and
# says what each package is for; a package the code needs goes in both, and in
# source/cells/030_setup.py for Colab. The YOLO detectors (ultralytics and its two
# helpers in requirements.txt) are left out here: the code installs them by itself the
# first time a detector is used.
name: msu_fruit
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - git                 # fetches Meta's SAM 2 code on first use
  - ffmpeg              # writes browser-playable result videos
  - notebook            # Jupyter, to run demo.ipynb
  - pip:
      - torch>=2.5.1
      - torchvision>=0.20.1
      - hydra-core>=1.3.2
      - iopath>=0.1.10
      - fvcore
      - tensordict>=0.6.0
      - submitit
      - pycocotools
      - tensorboard
      - scipy
      - pyyaml
      - pandas
      - matplotlib
      - opencv-python-headless
      - pillow
      - tqdm
      - anywidget
      - ipywidgets
